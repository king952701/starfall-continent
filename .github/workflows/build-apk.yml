name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starfall-mobile
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 环境确认
        uses: android-actions/setup-android@v3

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Cordova
        run: npm install --no-audit --no-fund

      - name: 同步网页版 + 添加安卓平台
        run: |
          node scripts/prepare.js
          npx cordova platform add android

      - name: 编译 Debug APK
        run: npx cordova build android --debug

      - name: 整理产物
        run: |
          mkdir -p dist
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk "dist/starfall-debug-${GITHUB_SHA::7}.apk"
          ls -lh dist

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: starfall-apk
          path: starfall-mobile/dist/*.apk
